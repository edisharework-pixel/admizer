# 애드마이저 V1 — 데이터 사전 (Data Dictionary)
#
# 목적: 모든 화면·룰·프롬프트가 동일 용어·정의를 사용하도록 단일 진실 소스 제공.
# 참조: 01~06 화면 스펙, admizer-v1-rules.yaml, admizer-v1-llm-prompt.md
#
# 규약:
#   - UI 표기: `ko_short` 사용 (간단모드는 한글 우선, 전문가모드는 영문 약어 허용)
#   - 내부 코드: `en` 사용 (camelCase 변환: revenue, adSales, roas …)
#   - LLM 프롬프트: `ko_short` 레이블 + 실제 값
#   - 룰 YAML condition: 소문자 스네이크 케이스 (roas, cvr, ctr …)
#
# 동의어(aliases)는 레거시 호환용이며 **신규 UI에서 사용 금지**.

version: 1

metrics:

  # --- 매출 / 수익 ---
  revenue:
    ko_full: 전체 매출
    ko_short: 매출
    en: Sales
    aliases: [전체매출]                # 🚫 사용 금지 (UI 표기는 "매출"로 통일)
    unit: KRW
    desc: 쿠팡 보고서 기준 해당 기간 총 판매액 (광고/비광고 합산)
    source: 쿠팡 광고 보고서 + 판매 보고서

  ad_sales:
    ko_full: 광고 매출액
    ko_short: 광고매출
    en: Ad Sales
    aliases: [광고매출액]
    unit: KRW
    desc: 광고 클릭 경유 주문 금액
    source: 쿠팡 광고 보고서

  net_profit:
    ko_full: 광고 순이익 (부가세·쿠폰 제외)
    ko_short: 광고 순이익
    en: Ad Net Profit
    aliases: [순이익]
    unit: KRW
    desc: |
      ad_sales - ad_spend - (ad_sales × (cogs_rate + coupang_fee_rate))
      ※ 쿠폰·프로모션·부가세 할인은 V1에서 반영하지 않음. UI는 "광고 순이익"으로
        표기하여 실제 정산과의 차이를 명시.
    source: 계산 필드

  # --- 효율 지표 ---
  roas:
    ko_full: 광고 수익률
    ko_short: ROAS
    en: ROAS
    aliases: [광고수익율, 광고수익률]
    unit: "%"
    desc: (ad_sales / ad_spend) × 100
    source: 계산 필드

  acos:
    ko_full: 광고 매출 원가율
    ko_short: ACOS
    en: ACOS
    unit: "%"
    desc: (ad_spend / ad_sales) × 100. ROAS의 역수.
    source: 계산 필드

  be_roas:
    ko_full: 손익분기 ROAS
    ko_short: BE-ROAS
    en: BE-ROAS
    unit: "%"
    desc: |
      손익분기 시점의 ROAS.
      공식: unit_price / (unit_price − cogs − coupang_fee) × 100
      도출: ROAS = 광고매출/광고비. 순이익 0 조건을 풀면 광고비 = 광고매출 × (1 − (원가+수수료)/판매가)
            → ROAS(break-even) = 판매가 / (판매가 − 원가 − 수수료).
      원가·수수료가 정확해야 의미가 있음. 미입력 상품은 BE-ROAS 계산 제외.
    source: 계산 필드 (원가·수수료 입력 전제)

  cvr:
    ko_full: 전환율
    ko_short: 전환율
    en: CVR
    aliases: []                          # "전환율"과 "CVR" 모두 허용, 간단모드는 전환율
    unit: "%"
    desc: 주문수 / 클릭수 × 100
    source: 쿠팡 광고 보고서

  ctr:
    ko_full: 클릭률
    ko_short: 클릭률
    en: CTR
    unit: "%"
    desc: 클릭수 / 노출수 × 100
    source: 쿠팡 광고 보고서

  cpc:
    ko_full: 클릭당 비용
    ko_short: CPC
    en: CPC
    unit: KRW
    desc: ad_spend / clicks
    source: 쿠팡 광고 보고서

  cpa:
    ko_full: 전환당 비용
    ko_short: 전환비용
    en: CPA
    aliases: [전환당비용]
    unit: KRW
    desc: ad_spend / orders
    source: 계산 필드

  # --- 볼륨 지표 ---
  impressions:
    ko_full: 노출수
    ko_short: 노출수
    en: Impressions
    unit: count
    source: 쿠팡 광고 보고서

  clicks:
    ko_full: 클릭수
    ko_short: 클릭수
    en: Clicks
    unit: count
    source: 쿠팡 광고 보고서

  orders:
    ko_full: 판매수량
    ko_short: 판매수량
    en: Orders
    unit: count
    source: 쿠팡 광고 보고서

  ad_spend:
    ko_full: 광고비
    ko_short: 광고비
    en: Ad Spend
    aliases: [광고집행비, 광고비용]
    unit: KRW
    source: 쿠팡 광고 보고서

  # --- 단가 ---
  unit_price:
    ko_full: 판매가
    ko_short: 판매가
    en: Unit Price
    aliases: [판매단가]
    unit: KRW
    desc: 상품·옵션별 정가. 할인 적용 전 기준.
    source: 쿠팡 상품 API (또는 사용자 입력)

  aov:
    ko_full: 주문당 객단가
    ko_short: 객단가 (AOV)
    en: AOV
    unit: KRW
    desc: ad_sales / orders. 세트·옵션 구성에 따라 unit_price와 다를 수 있음.
    source: 계산 필드

  cogs:
    ko_full: 원가
    ko_short: 원가
    en: COGS
    unit: KRW
    desc: 상품·옵션별 원가. 사용자 입력 또는 CSV.
    source: 사용자 입력

  coupang_fee_rate:
    ko_full: 쿠팡 수수료율
    ko_short: 쿠팡수수료
    en: Coupang Fee Rate
    unit: "%"
    desc: 카테고리별 기본값 9~15%. 사용자 덮어쓰기 가능.
    source: 카테고리 매핑 기본값 + 사용자 조정

  # --- 예산 ---
  daily_budget:
    ko_full: 일 예산
    ko_short: 일예산
    en: Daily Budget
    unit: KRW
    source: 쿠팡 광고 설정

  budget_utilization:
    ko_full: 예산 소진률
    ko_short: 예산 소진률
    en: Budget Utilization
    aliases: [예산소진률]
    unit: "%"
    desc: (당일 광고비 누적 / 일예산) × 100
    source: 계산 필드

  # --- 시계열 변화 ---
  _vs_prev_week_suffix:
    desc: |
      `{metric}_vs_prev_week` 형식은 전주 동일 기간 대비 비율(배수) 또는 증감률.
      비율로 표기할 때는 0~∞ (1.0 = 동일), 증감률은 -1.0 ~ ∞ (-0.2 = 20% 감소).
      룰 YAML과 UI는 비율 기준.

# === UI 표기 규칙 ===
ui_rules:
  simple_mode:
    desc: 한글 용어 우선. 전문 약어(ROAS, CPC 등)는 본인 학습 도움용 툴팁으로만.
    prefer: ko_short
    show_tooltip_with: en
  pro_mode:
    desc: 영문 약어 + 한글 병기 (예: "CVR 5.2% (전환율)")
    prefer: ko_short          # 동일이지만 헤더·레이블 병기 허용
    show_aliases_hidden: true
  forbidden_inline:
    - 광고수익율           # 맞춤법 오류 — "광고수익률"로 표기
    - 전환당비용           # 띄어쓰기 — "전환당 비용" 또는 "전환비용" 사용

# === 방향성 (개선/악화 매핑) ===
# 증감 색상 계산에 사용. delta 계산 시 방향에 따라 녹/적 결정.
direction:
  up_is_good:   [revenue, ad_sales, net_profit, roas, cvr, ctr, orders, impressions, clicks, aov]
  down_is_good: [cpc, cpa, acos, ad_spend]
  budget_utilization:
    desc: 복합 — 70~95% 구간은 정상(회색), >95% 경고(적), <60% 경고(황)

# === 단위 포맷 ===
format:
  KRW:
    default: "1,234,567원"
    short:   "123만원"         # 화면 05 표시 설정에서 선택 가능
  "%":
    roas_acos_be_roas: "345%"   # 정수
    cvr_ctr:           "5.2%"   # 소수 1~2자리
  count: "12,345"